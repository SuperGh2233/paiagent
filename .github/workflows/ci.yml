name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java 21 / MySQL / Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: paiagent
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: paiagent
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: "123456"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      APP_AUTH_DEFAULT_USERNAME: ci-operator
      APP_AUTH_DEFAULT_PASSWORD: ci-only-not-a-real-secret
      JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
      OPENAI_API_KEY: sk-ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Initialize database schema
        run: mysql --protocol=TCP -h 127.0.0.1 -uroot -p123456 < backend/src/main/resources/schema.sql
      - name: Run backend tests
        run: mvn -B -ntp -f backend/pom.xml test

  frontend:
    name: Frontend lint and production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check and production build
        working-directory: frontend
        run: npm run build
